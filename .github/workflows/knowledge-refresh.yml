name: Knowledge refresh

on:
  schedule:
    # Weekly, outside the normal contributor workday. The workflow only
    # gathers evidence and stages a review artifact; it never changes the
    # reviewed knowledge pack or opens a pull request.
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: knowledge-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# This is deliberately read-only. A refresh may identify drift, but a human
# must review a source-backed code change before the pack can be promoted.
permissions:
  contents: read

jobs:
  refresh:
    name: Check and stage knowledge review (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Make the upload below useful even if dependency installation or the
      # build fails before the refresh command can produce its own evidence.
      - name: Prepare knowledge refresh artifact directory
        run: |
          mkdir -p knowledge-refresh
          printf '%s\n' 'Knowledge refresh did not start; inspect prior job steps for the failure.' > knowledge-refresh/preflight.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run skills:check
      - run: npm run build

      - id: knowledge
        name: Refresh official-source and model-catalog evidence
        shell: bash
        run: |
          set -uo pipefail
          # `refresh` never changes active profiles, rules, or prompts. Keep
          # collecting and validating evidence so the final report is
          # actionable rather than failing at the first observed problem.
          set +e
          node apps/eib/dist/cli.js knowledge refresh \
            --output knowledge-refresh/knowledge-refresh.json --json \
            > knowledge-refresh/knowledge-refresh-command.json
          refresh_exit=$?
          set -e

          node --input-type=module - \
            knowledge-refresh/knowledge-refresh-command.json \
            "$refresh_exit" <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const [refreshPath, refreshExit] = process.argv.slice(2);
          const envelope = JSON.parse(readFileSync(refreshPath, "utf8"));
          const proposal = envelope.data?.proposal;
          if (envelope.command !== "knowledge" || proposal === undefined) {
            throw new Error("Knowledge refresh did not produce the expected CLI proposal.");
          }
          const changed = proposal.sourceCheck.checks.filter((entry) => entry.status === "changed");
          const unreachable = proposal.sourceCheck.checks.filter((entry) => entry.status === "unreachable");
          const requiresReview =
            proposal.sourceCheck.status !== "current" ||
            proposal.discovery.status !== "current";
          const incomplete =
            proposal.sourceCheck.status === "incomplete" ||
            proposal.discovery.status === "incomplete";
          const summary = [
            "## Knowledge refresh evidence",
            "",
            `- **Source status:** \`${proposal.sourceCheck.status}\``,
            `- **Discovery status:** \`${proposal.discovery.status}\``,
            `- **Reviewed pack:** \`${proposal.packVersion}\``,
            `- **Changed sources:** ${changed.length}`,
            `- **Unavailable sources:** ${unreachable.length}`,
            `- **Unreviewed model/surface candidates:** ${proposal.discovery.candidates.length}`,
            `- **Affected target profiles:** ${proposal.affectedTargetIds.length}`,
            `- **Refresh exit:** \`${refreshExit}\``,
            "",
            "The uploaded artifacts are review evidence only. This workflow has read-only permissions and cannot modify the knowledge pack, commit, push, or create a pull request.",
          ].join("\n");
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `outcome=${incomplete ? "incomplete" : requiresReview ? "needs_review" : "current"}\n`,
          );
          NODE

      - name: Run release validation against the current reviewed pack
        if: always()
        run: npm run release:check

      - name: Upload knowledge refresh evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-refresh-${{ github.run_id }}
          path: knowledge-refresh/
          if-no-files-found: error
          retention-days: 30

      - name: Surface knowledge review state
        if: always()
        env:
          KNOWLEDGE_OUTCOME: ${{ steps.knowledge.outputs.outcome }}
        run: |
          if [[ "$KNOWLEDGE_OUTCOME" == "incomplete" ]]; then
            echo "Knowledge refresh has incomplete official-source evidence."
            exit 1
          fi
          if [[ "$KNOWLEDGE_OUTCOME" == "needs_review" ]]; then
            echo "Knowledge refresh found reviewable evidence; active knowledge was not changed."
          fi
